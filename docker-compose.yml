include:
  - docker-compose-services.yml

services:
  excalidraw:
    stdin_open: true
    build:
      context: .
      target: development
      args:
        - NODE_ENV=development
        - USER_UID=${USER_UID:-1000}
        - USER_GID=${USER_GID:-1000}
    ports:
      - "${VITE_APP_PORT:-3000}:3000"
    healthcheck:
      disable: true
    environment:
      - NODE_ENV=development
      - VITE_APP_PORT=3000
      - VITE_APP_STORAGE_PROXY_TARGET=http://excalidraw-storage-backend:8080
    volumes:
      - node_modules:/node/app/node_modules
      - ./:/node/app

volumes:
  node_modules:
