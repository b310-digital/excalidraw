include:
  - docker-compose-services.yml

services:
  excalidraw:
    stdin_open: true
    build:
      context: .
      target: development
      args:
        - NODE_ENV=development
    ports:
      - "${VITE_APP_PORT:-3000}:3000"
    healthcheck:
      disable: true
    environment:
      - NODE_ENV=development
      - VITE_APP_PORT=3000
    volumes:
      - node_modules:/opt/node_app/node_modules
      - ./:/opt/node_app/

volumes:
  node_modules:
