include:
  - docker-compose-services.yml

services:
  excalidraw:
    stdin_open: true
    build:
      context: .
      target: production
    container_name: excalidraw
    ports:
      - "${VITE_APP_PORT:-5010}:8080"
    healthcheck:
      disable: true
    environment:
      - NODE_ENV=production
