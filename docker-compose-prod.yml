include:
  - path: docker-compose-services.yml
    # prod defaults (service ports 5011/5012); values from the
    # project env (.env, .env.production.local, shell) take precedence
    env_file: .env.production

services:
  excalidraw:
    stdin_open: true
    build:
      context: .
      target: production
      args:
        - VITE_APP_STORAGE_PORT=${VITE_APP_STORAGE_PORT:-5011}
        - VITE_APP_ROOM_PORT=${VITE_APP_ROOM_PORT:-5012}
    container_name: excalidraw
    ports:
      - "${PROD_APP_PORT:-5010}:8080"
    healthcheck:
      disable: true
    environment:
      - NODE_ENV=production
