include:
  - docker-compose-services.yml

services:
  excalidraw:
    stdin_open: true
    build:
      context: .
      target: production
    container_name: excalidraw
    ports:
      - "${PROD_APP_PORT:-5010}:3000"
    restart: always
    healthcheck:
      disable: true
    environment:
      - NODE_ENV=production
      - NGINX_PORT=3000
